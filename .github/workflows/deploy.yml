# Rebuilds the site from live YouTube data every hour and publishes it to GitHub Pages.
name: Update and publish site

on:
  push:
    branches: [main]
  schedule:
    # GitHub delays or skips scheduled runs when busy, so ask every 15 minutes
    # (avoiding the busy top of the hour) to land roughly hourly in practice.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:        # "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write            # lets the job keep its own hourly schedule switched on

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Remembers which uploads are Shorts between runs.
      - uses: actions/cache@v4
        with:
          path: .cache
          key: shorts-${{ github.run_id }}
          restore-keys: shorts-

      - name: Build from YouTube
        run: node scripts/build.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      # GitHub pauses hourly schedules after 60 days without code changes; this keeps it on.
      - name: Keep the hourly schedule switched on
        if: github.event_name == 'schedule'
        run: gh workflow enable deploy.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
